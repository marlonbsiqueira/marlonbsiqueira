<!DOCTYPE html>
<!--
  Source of images/og-card.jpg, the preview image shown when the site is shared
  (LinkedIn, WhatsApp, etc.). Regenerate after editing:
    open this file in Chromium at 1200x627 and screenshot it as JPEG
  (see tools/README.md).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Share card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  body {
    display: grid; grid-template-columns: 1fr 430px;
    background: radial-gradient(120% 140% at 0% 0%, #12404a 0%, #0a181e 62%);
    color: #eef3f3; font-family: 'Inter', sans-serif;
  }
  .text { padding: 58px 0 54px 64px; display: flex; flex-direction: column; }
  .kicker {
    font-family: 'JetBrains Mono', monospace; font-size: 19px; letter-spacing: .14em;
    color: #8fd3df; text-transform: uppercase;
  }
  h1 {
    margin-top: 22px; font-family: 'Fraunces', serif; font-weight: 500;
    font-size: 84px; line-height: .98; letter-spacing: -.02em;
  }
  .role { margin-top: 20px; font-size: 30px; line-height: 1.3; color: #c9d6d8; }
  .stats { margin-top: auto; display: flex; gap: 14px; }
  .stat {
    padding: 14px 18px; border: 1.5px solid rgba(143, 211, 223, .35); border-radius: 10px;
    background: rgba(255, 255, 255, .04);
  }
  .stat b { display: block; font-family: 'Fraunces', serif; font-weight: 500; font-size: 38px; line-height: 1; color: #fff; }
  .stat span { display: block; margin-top: 6px; font-size: 17px; color: #b7c7ca; }
  .cta { margin-top: 26px; display: flex; align-items: center; gap: 16px; font-size: 21px; color: #b7c7ca; }
  .cta strong {
    padding: 11px 22px; border-radius: 999px; background: #5fb3c2; color: #06141a;
    font-weight: 600; font-size: 22px;
  }
  .photo {
    background: url(../images/Menu.webp) -201px -92px / 859px 952px no-repeat;
    box-shadow: inset 28px 0 40px -20px rgba(10, 24, 30, .55);
  }
</style>
</head>
<body>
  <div class="text">
    <p class="kicker">Finance Transformation Lead</p>
    <h1>Marlon B<br>Siqueira</h1>
    <p class="role">SAP S/4HANA · Intelligent Automation<br>Advanced Analytics · Europe &amp; LatAm</p>
    <div class="stats">
      <div class="stat"><b>€200K+</b><span>productivity savings</span></div>
      <div class="stat"><b>~9 FTE</b><span>efficiency impact</span></div>
      <div class="stat"><b>12+ yrs</b><span>international</span></div>
    </div>
    <p class="cta"><strong>View portfolio →</strong> Case studies · Results · Contact</p>
  </div>
  <div class="photo" role="img" aria-label="Marlon B Siqueira"></div>
</body>
</html>
